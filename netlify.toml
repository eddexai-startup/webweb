[build]
  publish = "dist"
  command = "npm run build"

# Cache static assets (images, fonts, bundles) for 1 year with immutable tag
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for general pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Single-Page Application redirect fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
